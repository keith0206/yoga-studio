{% extends "base.html" %}
{% block title %}Sign in — Studio Hours{% endblock %}
{% block content %}
<section class="login-screen">
  <div class="login-card">
    <span class="brand">Studio Hours</span>
    <p>Owner or teacher sign in</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <p class="form-error">Invalid username or password.</p>
      {% endif %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required />
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
    <p class="hint" style="margin-top:1rem">Demo: owner / owner123 · jane / teacher123</p>
  </div>
</section>
{% endblock %}
