app = "soulful"
primary_region = "sin"

[build]

[env]
  DEBUG = "false"
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/db.sqlite3"
  # Include .fly.dev so proxy health checks are not rejected as DisallowedHost.
  # If a Fly secret ALLOWED_HOSTS is set, it overrides this — keep them in sync.
  ALLOWED_HOSTS = "localhost,127.0.0.1,soulful.fly.dev,.fly.dev,*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/health/"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "yoga_studio_data"
  destination = "/data"
